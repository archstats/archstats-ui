name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Wails apps must be built natively per OS (webkit2gtk on Linux,
        # Xcode on macOS, WebView2 + cgo on Windows). Every leg runs the Go
        # tests too — that is what actually exercises tree-sitter + sqlite
        # (cgo) on each platform.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Go vet + test
        run: |
          go vet ./...
          go test ./...

      - name: Wails build
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Linux" ]; then extra="-tags webkit2_41"; fi
          wails build -clean $extra

      - uses: actions/upload-artifact@v4
        with:
          name: archstats-desktop-${{ runner.os }}-unsigned-${{ github.sha }}
          path: build/bin/
          if-no-files-found: error
