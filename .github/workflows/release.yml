name: Release Archstats Desktop

# Pushing a tag vX.Y.Z builds every platform natively, packages the results,
# VERIFIES each package (extract/install it and run the shipped binary's
# --selfcheck, plus bundle/version checks), then opens a DRAFT GitHub Release
# with a SHA-256 checksums.txt — you inspect and publish by hand.
#
# workflow_dispatch and the weekly schedule run the same build + package +
# verify and only upload workflow artifacts: a canary that catches runner
# image drift before release day.
#
# scripts/release.sh cuts the tag; the notes are that version's section of
# CHANGELOG.md, and a tag whose go.mod pins the engine by commit is refused.
#
# All builds are currently UNSIGNED (see tasks/release-pipeline.md): on macOS
# 15 and later the first launch needs System Settings → Privacy & Security →
# Open Anyway; Windows shows a SmartScreen warning. The install guide says so.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  WAILS_VERSION: v2.12.0
  NFPM_VERSION: v2.47.0
  APP: archstats-desktop

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, runner: macos-latest,     platform: darwin/universal, expected_files: 2 }
          - { name: windows-amd64,   runner: windows-latest,   platform: windows/amd64,    expected_files: 2 }
          - { name: linux-amd64,     runner: ubuntu-latest,    platform: linux/amd64,      expected_files: 3 }
          - { name: linux-arm64,     runner: ubuntu-24.04-arm, platform: linux/arm64,      expected_files: 3 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve version
        id: version
        run: |
          # number is what packages carry: digits and dots only. NSIS's
          # VIFileVersion rejects anything else (the Windows canary failed on
          # "0.0.0.devabc1234") and rpm forbids '-', so a prerelease tag like
          # v0.5.0-rc.1 packages as 0.5.0; the binary still reports the tag.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            number="${version#v}"
            number="${number%%-*}"
          else
            version="dev-${GITHUB_SHA::7}"
            number="0.0.0"
          fi
          [[ "$number" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version number: $number"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Building $version (${{ matrix.platform }})"

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}

      - name: Windows installer tooling
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # choco updates the machine PATH, which this job never re-reads;
          # without this Wails silently skips the installer ("makensis not found").
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          "/c/Program Files (x86)/NSIS/makensis.exe" -VERSION

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp product version
        run: |
          tmp=$(mktemp)
          jq --arg v "${{ steps.version.outputs.number }}" '.info.productVersion = $v' wails.json > "$tmp"
          mv "$tmp" wails.json

      - name: Wails build
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Linux" ]; then extra="-tags webkit2_41"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then extra="-nsis"; fi
          wails build -clean -platform ${{ matrix.platform }} $extra \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}"
          ls -la build/bin
          # Wails only warns when makensis is missing — make that a hard failure.
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f "build/bin/${APP}-amd64-installer.exe" || { echo "NSIS installer was not produced"; exit 1; }
          fi

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p out
          base="${APP}-${VERSION}-${{ matrix.name }}"
          case "$RUNNER_OS" in
            macOS)
              # hdiutil's own size estimate fell short once the universal app
              # grew ("No space left on device"): size the volume from the app.
              mb=$(( $(du -sm "build/bin/${APP}.app" | cut -f1) * 5 / 4 + 32 ))
              hdiutil create -volname "Archstats Desktop" -srcfolder "build/bin/${APP}.app" \
                -size "${mb}m" -ov -format UDZO "out/${base}.dmg"
              ditto -c -k --keepParent "build/bin/${APP}.app" "out/${base}.zip"
              ;;
            Windows)
              cp build/bin/${APP}-amd64-installer.exe "out/${base}-installer.exe"
              (cd build/bin && 7z a "../../out/${base}-portable.zip" ${APP}.exe)
              ;;
            Linux)
              tar -czf "out/${base}.tar.gz" -C build/bin "${APP}"
              export GOARCH="${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}"
              nfpm package --config nfpm.yaml --packager deb --target out/
              nfpm package --config nfpm.yaml --packager rpm --target out/
              ;;
          esac
          ls -la out
          test "$(ls out | wc -l)" -eq "${{ matrix.expected_files }}"

      # ---- Verification: everything below runs against the PACKAGED
      # ---- artifacts, never the build directory.

      - name: Verify (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -x
          mnt=$(mktemp -d)
          hdiutil attach out/*.dmg -mountpoint "$mnt" -nobrowse -quiet
          app="$mnt/${APP}.app"
          bin="$app/Contents/MacOS/${APP}"
          test -d "$app"
          lipo -archs "$bin" | grep -q x86_64
          lipo -archs "$bin" | grep -q arm64
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          short=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$short" = "$VERSION_NUMBER"
          test "$("$bin" --version)" = "${APP} ${VERSION}"
          "$bin" --selfcheck
          # Launch liveness: the runner has a GUI session; the app must still
          # be alive after 10s (catches crash-on-launch / broken asset embed).
          open -n "$app"
          sleep 10
          pgrep -f "$bin" >/dev/null
          pkill -f "$bin" || true
          sleep 2
          hdiutil detach "$mnt" -quiet
          # The zip must contain the same runnable bundle.
          tmp=$(mktemp -d)
          ditto -x -k out/*.zip "$tmp"
          test "$("$tmp/${APP}.app/Contents/MacOS/${APP}" --version)" = "${APP} ${VERSION}"

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "${env:APP}"
          # Silent NSIS install into a known directory, then run the INSTALLED exe.
          $installer = (Get-ChildItem out\*-installer.exe | Select-Object -First 1).FullName
          $dir = 'C:\archstats-verify'
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -Wait
          $exe = Join-Path $dir "$app.exe"
          if (!(Test-Path $exe)) { throw "installed exe missing at $exe" }
          Get-ChildItem $dir
          # GUI-subsystem binary: no stdout, so the exit code is the contract.
          $p = Start-Process -FilePath $exe -ArgumentList '--selfcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-check failed with exit code $($p.ExitCode)" }
          # Launch liveness.
          $gui = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($gui.HasExited) { throw "app exited early with $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id -Force
          # Portable zip: extract and self-check too.
          $zip = (Get-ChildItem out\*-portable.zip | Select-Object -First 1).FullName
          7z x $zip -oC:\archstats-portable -y | Out-Null
          $p = Start-Process -FilePath "C:\archstats-portable\$app.exe" -ArgumentList '--selfcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "portable self-check failed with $($p.ExitCode)" }

      - name: Verify (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -x
          # .deb: a real install resolves the declared gtk/webkit deps too.
          sudo apt-get install -y ./out/*.deb
          test "$(${APP} --version)" = "${APP} ${VERSION}"
          ${APP} --selfcheck
          test -f /usr/share/applications/${APP}.desktop
          test -f /usr/share/pixmaps/${APP}.png
          # Launch liveness under a virtual display: still alive after 15s
          # means timeout killed it (exit 124), anything else is a crash.
          set +e
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a timeout 15 ${APP}
          rc=$?
          set -e
          test "$rc" -eq 124
          # tar.gz
          tmp=$(mktemp -d)
          tar -xzf out/*.tar.gz -C "$tmp"
          test "$("$tmp/${APP}" --version)" = "${APP} ${VERSION}"
          # .rpm: install inside a Fedora container (Docker is on the runner).
          docker run --rm -v "$PWD/out:/out:ro" fedora:latest bash -c \
            "dnf install -y /out/*.rpm >/dev/null && ${APP} --selfcheck"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes fall back to the commits since the last tag

      # A release names the engine it carries; a pseudo-version names nothing
      # anyone can install or read the notes of.
      - name: Engine pinned to a tag
        run: |
          pinned="$(awk '$1 == "github.com/archstats/archstats" { print $2; exit }' go.mod)"
          echo "engine: $pinned"
          if [[ "$pinned" =~ -[0-9]{14}-[0-9a-f]{12}$ ]]; then
            echo "go.mod pins the engine at a commit; release the engine and pin its tag (scripts/release.sh --engine)"
            exit 1
          fi

      - name: Release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          scripts/changelog.sh section "$tag" > notes.md
          if [ ! -s notes.md ]; then
            previous="$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then scripts/changelog.sh commits "$previous" "$tag" > notes.md; fi
          fi
          printf '\n---\n\nInstall, including opening an unsigned build: https://archstats.github.io/archstats/install/\n' >> notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: |
          cd out
          test "$(ls | wc -l)" -eq 10   # 2 macOS + 2 Windows + 3 + 3 Linux
          sha256sum -- * > checksums.txt
          sha256sum -c checksums.txt
          cat checksums.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" out/* \
            --repo "${{ github.repository }}" \
            --title "Archstats Desktop $tag" \
            --notes-file notes.md \
            --draft
